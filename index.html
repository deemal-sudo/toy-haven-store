<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy Haven — Figurines, Toys, Board Games &amp; Diecast Cars</title>
  <meta name="description" content="Toy Haven is a home for collectible figurines, toys, board games and diecast model cars.">
  <meta name="theme-color" content="#ff5a36">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-slider" id="hero-slider"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>Featured Products</h2>
            <p>Hand-picked pieces our collectors keep coming back for.</p>
          </div>
          <a href="products.html" class="section-link">View All Products &rarr;</a>
        </div>
        <div class="product-grid" id="featured-grid"></div>
      </div>
    </section>

    <section class="section" style="background:var(--color-bg-soft)">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>Shop by Specialty</h2>
            <p>Four collections, one shelf.</p>
          </div>
        </div>
        <div class="category-grid">
          <a class="category-tile" href="products.html?category=Figurines" data-reveal style="--tile-color:var(--cat-figurines)">
            <div class="category-icon"><img src="assets/images/home/action-figure_home.jpg" alt="Figurines"></div>
            <h3>Figurines</h3>
            <span>Explore the range</span>
          </a>
          <a class="category-tile" href="products.html?category=Toys" data-reveal style="--tile-color:var(--cat-toys)">
            <div class="category-icon"><img src="assets/images/home/toys_home-banner-1.jpg" alt="Toys"></div>
            <h3>Toys</h3>
            <span>Explore the range</span>
          </a>
          <a class="category-tile" href="products.html?category=Board+Games" data-reveal style="--tile-color:var(--cat-boardgames)">
            <div class="category-icon"><img src="assets/images/home/board-games_home.jpg" alt="Board Games"></div>
            <h3>Board Games</h3>
            <span>Explore the range</span>
          </a>
          <a class="category-tile" href="products.html?category=Diecast+Cars" data-reveal style="--tile-color:var(--cat-diecast)">
            <div class="category-icon"><img src="assets/images/home/toy-car_home.jpg" alt="Diecast Cars"></div>
            <h3>Diecast Cars</h3>
            <span>Explore the range</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
